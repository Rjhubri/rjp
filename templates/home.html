<!DOCTYPE html>
<html>
<head>
    <title>Add User</title>
</head>
<body>

<h1>User Form</h1>

<form action="/submit" method="POST">

    <input type="text"
           name="name"
           placeholder="Name"
           required>
    <br><br>

    <input type="email"
           name="email"
           placeholder="Email"
           required>
    <br><br>

    <input type="text"
           name="phone"
           placeholder="Phone"
           required>
    <br><br>

    <button type="submit">
        Submit
    </button>

</form>

</body>
</html>
